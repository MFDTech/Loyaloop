name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: loyaloop
          POSTGRES_PASSWORD: loyaloop
          POSTGRES_DB: loyaloop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loyaloop" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://loyaloop:loyaloop@localhost:5432/loyaloop_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: VITE_API_URL=/api pnpm build
      - run: pnpm server:build
